<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chiffre Blitz ⚡ — Sur mobile</title>
<style>
body{margin:0;background:#0a0514;color:#fff;font-family:system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;box-sizing:border-box}
.card{max-width:420px;width:100%;text-align:center}
h1{color:#00d2ff;font-size:26px;margin:12px 0 6px;letter-spacing:1px}
p{color:#ddd;font-size:14px;line-height:1.5}
.btn{display:block;padding:13px;border-radius:12px;font-weight:800;text-decoration:none;margin-bottom:10px}
.play{background:linear-gradient(45deg,#3ae05a,#1a9a3a);color:#fff}
.devlink{color:#666;font-size:11px;cursor:pointer;margin-top:18px;text-decoration:underline}
.devbox{display:none;margin-top:10px}
input{background:#111;border:1px solid #444;color:#fff;border-radius:10px;padding:10px;width:80%;text-align:center}
button{margin-top:8px;padding:10px 22px;border:none;border-radius:10px;background:#00d2ff;color:#001;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<div class="card">
<div style="font-size:56px;">📱</div>
<h1>CHIFFRE BLITZ ⚡</h1>
<p>Repère. Clique. Triomphe.<br>Le jeu est disponible <b>gratuitement sur Android</b>.<br>(Passe de saison & packs dans l'app.)</p>
<a class="btn play" target="_blank" rel="noopener" href="https://play.google.com/store/apps/details?id=com.chiffreblitz.app">▶ TÉLÉCHARGER SUR GOOGLE PLAY</a>
<p style="color:#888;font-size:12px;">Version iOS : bientôt 🍎</p>
<div class="devlink" onclick="document.getElementById('devbox').style.display='block'">Accès développeur / test</div>
<div class="devbox" id="devbox">
<input id="devcode" placeholder="Code de test" autocomplete="off">
<br><button onclick="location.href='/?dev='+encodeURIComponent(document.getElementById('devcode').value.trim())">Entrer</button>
</div>
</div>
</body>
</html>
