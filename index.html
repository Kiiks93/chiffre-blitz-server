<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chiffre Blitz - Boutique</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121214;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 500px;
            margin-bottom: 20px;
        }

        .coins-display {
            background: #202225;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            color: #f8b500;
            border: 1px solid #36393f;
        }

        /* BOUTONS GENERAUX */
        .btn-primary, .btn-secondary {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }

        .btn-primary {
            background: #38ef7d;
            color: #111;
        }

        .btn-secondary {
            background: #4f545c;
            color: white;
            margin-top: 15px;
            width: 100%;
        }

        .btn-primary:hover, .btn-secondary:hover {
            transform: scale(1.02);
        }

        /* MODALE BOUTIQUE */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background: #1e1f23;
            border-radius: 12px;
            padding: 20px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #2f3136;
        }

        /* ONGLETS */
        .tabs {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: #2f3136;
            border: 2px solid transparent;
            color: #b9bbbe;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .tab-btn:hover {
            color: #fff;
        }

        #shop-tab-bonus.active {
            background: rgba(56, 239, 125, 0.15);
            color: #38ef7d;
            border-color: #38ef7d;
        }

        #shop-tab-malus.active {
            background: rgba(255, 75, 43, 0.15);
            color: #ff4b2b;
            border-color: #ff4b2b;
        }

        /* GRILLE BOUTIQUE */
        .shop-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            max-height: 320px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .power-card {
            background: #2f3136;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 2px solid transparent;
        }

        .power-card.equipped {
            border-color: #38ef7d;
            background: #25332a;
        }

        .power-card h4 {
            margin: 0 0 6px 0;
            font-size: 0.95rem;
        }

        .power-card p {
            margin: 0 0 10px 0;
            font-size: 0.75rem;
            color: #dcddde;
            flex-grow: 1;
        }

        .power-card .price {
            font-weight: bold;
            color: #f8b500;
            font-size: 0.85rem;
            margin-bottom: 8px;
        }

        .power-btn {
            padding: 6px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .power-btn.buy {
            background: #f8b500;
            color: #111;
        }

        .power-btn.equip {
            background: #7289da;
            color: white;
        }

        .power-btn.active {
            background: #38ef7d;
            color: #111;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Chiffre Blitz</h1>
        <div class="coins-display">🪙 <span id="user-coins">100</span></div>
    </div>

    <button class="btn-primary" onclick="openShop()">🛍️ Ouvrir la Boutique</button>

    <!-- MODALE BOUTIQUE AVEC ONGLETS -->
    <div id="modal-shop" class="modal-overlay" style="display:none;">
        <div class="modal-card">
            <h2 style="margin:0 0 10px 0; color:#38ef7d;">🛍️ BOUTIQUE</h2>
            
            <div class="tabs">
                <button id="shop-tab-bonus" class="tab-btn active" onclick="switchShopTab('bonus')">🟢 Bonus (pour soi)</button>
                <button id="shop-tab-malus" class="tab-btn" onclick="switchShopTab('malus')">🔴 Malus (adversaire)</button>
            </div>

            <div id="shop-container" class="shop-grid"></div>

            <button class="btn-secondary" onclick="closeShop()">Fermer</button>
        </div>
    </div>

    <script>
        // CATALOGUE DES POUVOIRS
        const POWERS_CATALOG = [
            // Bonus (pour soi)
            { id: 'spotlight', name: '💡 Projecteur', desc: 'Mets en valeur plusieurs tuiles.', price: 100, type: 'bonus' },
            { id: 'joker', name: '🃏 Joker', desc: 'Valide automatiquement une paire.', price: 150, type: 'bonus' },
            { id: 'focus', name: '🎯 Focus', desc: 'Masque les mauvaises paires 5 sec.', price: 150, type: 'bonus' },
            { id: 'nova', name: '🌟 Nova', desc: 'Ajoute 10 secondes au chrono.', price: 200, type: 'bonus' },

            // Malus (adversaire)
            { id: 'quake', name: '📳 Séisme', desc: 'Fait trembler l\'écran adverse.', price: 200, type: 'malus' },
            { id: 'micro', name: '🔍 Micro-Tuiles', desc: 'Rétrécit la grille adverse.', price: 180, type: 'malus' },
            { id: 'eclipse', name: '🌙 Éclipse', desc: 'Plonge l\'adversaire dans le noir.', price: 220, type: 'malus' },
            { id: 'chaos', name: '🌀 Chaos', desc: 'Mélange la grille de l\'adversaire.', price: 300, type: 'malus' }
        ];

        // PROFIL JOUEUR (PERSISTANCE LOCALSTORAGE)
        let myProfile = JSON.parse(localStorage.getItem('chiffre_blitz_profile')) || {
            coins: 100,
            inventory: [],
            equippedPower: null
        };

        let currentShopTab = 'bonus';

        function saveProfile() {
            localStorage.setItem('chiffre_blitz_profile', JSON.stringify(myProfile));
            updateUI();
        }

        function updateUI() {
            document.getElementById('user-coins').innerText = myProfile.coins;
        }

        function openShop() {
            document.getElementById('modal-shop').style.display = 'flex';
            switchShopTab(currentShopTab);
        }

        function closeShop() {
            document.getElementById('modal-shop').style.display = 'none';
        }

        function switchShopTab(type) {
            currentShopTab = type;
            
            document.getElementById('shop-tab-bonus').classList.toggle('active', type === 'bonus');
            document.getElementById('shop-tab-malus').classList.toggle('active', type === 'malus');

            const container = document.getElementById('shop-container');
            container.innerHTML = '';

            const filteredPowers = POWERS_CATALOG.filter(p => p.type === type);

            filteredPowers.forEach(p => {
                const isOwned = myProfile.inventory.includes(p.id);
                const isEquipped = myProfile.equippedPower === p.id;

                const card = document.createElement('div');
                card.className = `power-card ${isEquipped ? 'equipped' : ''}`;
                card.innerHTML = `
                    <h4>${p.name}</h4>
                    <p>${p.desc}</p>
                    <div class="price">${p.price} 🪙</div>
                    ${!isOwned ? 
                        `<button class="power-btn buy" onclick="buyPower('${p.id}')">Acheter</button>` :
                        `<button class="power-btn ${isEquipped ? 'active' : 'equip'}" onclick="equipPower('${p.id}')">${isEquipped ? 'Équipé ✅' : 'Équiper'}</button>`
                    }
                `;
                container.appendChild(card);
            });
        }

        function buyPower(id) {
            const power = POWERS_CATALOG.find(p => p.id === id);
            if (!power) return;

            if (myProfile.coins >= power.price) {
                myProfile.coins -= power.price;
                myProfile.inventory.push(id);
                saveProfile();
                switchShopTab(currentShopTab);
            } else {
                alert('Pas assez de pièces !');
            }
        }

        function equipPower(id) {
            if (myProfile.equippedPower === id) {
                myProfile.equippedPower = null;
            } else {
                myProfile.equippedPower = id;
            }
            saveProfile();
            switchShopTab(currentShopTab);
        }

        // Initialisation
        document.addEventListener('DOMContentLoaded', updateUI);
    </script>
</body>
</html>
