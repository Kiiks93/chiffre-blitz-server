<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chiffre Blitz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1, h2 {
            text-align: center;
            color: #4f46e5;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            font-size: 16px;
            border-radius: 4px;
            border: none;
            box-sizing: border-box;
        }
        input {
            background: #2d2d2d;
            color: #fff;
            border: 1px solid #444;
        }
        button {
            background: #4f46e5;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #4338ca;
        }
        ul {
            list-style: none;
            padding: 0;
            max-height: 200px;
            overflow-y: auto;
        }
        li {
            background: #2d2d2d;
            margin: 8px 0;
            padding: 10px 15px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        li button {
            width: auto;
            padding: 6px 12px;
            margin: 0;
            font-size: 14px;
        }
        .error {
            color: #f87171;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Chiffre Blitz</h1>

        <!-- ÉCRAN DU LOBBY -->
        <div id="lobby-screen">
            <h2>Créer un salon</h2>
            <input type="text" id="room-name-input" placeholder="Nom du salon">
            <input type="text" id="room-password-input" placeholder="Mot de passe (optionnel)">
            <button onclick="createRoom()">Créer et rejoindre</button>

            <h2>Salons disponibles</h2>
            <ul id="room-list-container">
                <li>Recherche des salons...</li>
            </ul>
            <div id="error-message" class="error"></div>
        </div>

        <!-- ÉCRAN DU SALON DE JEU -->
        <div id="game-screen" style="display: none;">
            <h2 id="room-title">Salon</h2>
            <p>Vous êtes dans le salon de jeu !</p>
            <button onclick="leaveRoom()">Quitter le salon</button>
        </div>
    </div>

    <!-- Script Socket.io (Si hébergé sur Render, remplacer par l'URL complète de ton backend, ex: io('https://ton-app.onrender.com')) -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        function createRoom() {
            const roomName = document.getElementById('room-name-input').value;
            const password = document.getElementById('room-password-input').value;
            
            if (!roomName.trim()) {
                alert("Veuillez entrer un nom de salon valide.");
                return;
            }

            socket.emit('create-room', { roomName, password });
        }

        function tryJoinRoom(roomName, hasPassword) {
            let password = '';
            if (hasPassword) {
                password = prompt(`Le salon "${roomName}" est sécurisé. Entrez le mot de passe :`);
                if (password === null) return; // Si l'utilisateur clique sur Annuler
            }
            socket.emit('join-room', { roomName, password });
        }

        function leaveRoom() {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('lobby-screen').style.display = 'block';
            window.location.reload(); // Recharge pour réinitialiser proprement la socket/les états si besoin
        }

        // Mise à jour de la liste des salons reçue du serveur
        socket.on('room-list', (rooms) => {
            const container = document.getElementById('room-list-container');
            container.innerHTML = '';

            if (!rooms || rooms.length === 0) {
                container.innerHTML = '<li>Aucun salon ouvert pour le moment.</li>';
                return;
            }

            rooms.forEach(room => {
                const li = document.createElement('li');
                const padlock = room.hasPassword ? ' 🔒' : '';
                
                li.innerHTML = `
                    <span>${room.name}${padlock}</span>
                    <button onclick="tryJoinRoom('${room.name}', ${room.hasPassword})">Rejoindre</button>
                `;
                container.appendChild(li);
            });
        });

        // Succès de connexion à un salon
        socket.on('joined-success', ({ roomName }) => {
            document.getElementById('lobby-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            document.getElementById('room-title').innerText = `Salon : ${roomName}`;
            document.getElementById('error-message').innerText = '';
        });

        // Gestion des erreurs (mot de passe incorrect, etc.)
        socket.on('error-msg', (msg) => {
            document.getElementById('error-message').innerText = msg;
        });
    </script>
</body>
</html>
