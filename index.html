<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chiffre Blitz - 1v1 Arena</title>
    <style>
        :root {
            --bg-dark: #0f051d;
            --primary-cyan: #00d2ff;
            --accent-pink: #ff007f;
            --tile-violet: #2a1845;
            --text-light: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            background: linear-gradient(135deg, rgba(42, 24, 69, 0.8), rgba(15, 5, 29, 0.9));
            border: 2px solid var(--primary-cyan);
            border-radius: 20px;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.4), inset 0 0 15px rgba(255, 0, 127, 0.2);
            padding: 40px;
            width: 450px;
            text-align: center;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: var(--primary-cyan);
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.7);
            letter-spacing: 2px;
        }

        p {
            color: #b8b8f3;
            margin-bottom: 30px;
        }

        .btn {
            background: linear-gradient(90deg, var(--primary-cyan), var(--accent-pink));
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
            transition: all 0.3s ease;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: scale(1.03);
            box-shadow: 0 0 25px var(--primary-cyan), 0 0 25px var(--accent-pink);
        }

        #status {
            margin-top: 20px;
            font-weight: bold;
            color: var(--accent-pink);
            text-shadow: 0 0 8px rgba(255, 0, 127, 0.6);
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        .tile {
            background-color: var(--tile-violet);
            border: 2px solid var(--primary-cyan);
            border-radius: 15px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: inset 0 0 10px rgba(0, 210, 255, 0.2);
            transition: all 0.2s ease;
        }

        .tile:hover {
            background-color: var(--primary-cyan);
            color: var(--bg-dark);
            box-shadow: 0 0 15px var(--primary-cyan);
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>CHIFFRE BLITZ</h1>
        <p>Arène Multijoueur 1v1 - Temps Réel</p>
        
        <div id="menu-section">
            <button class="btn" id="matchmaking-btn">Trouver un adversaire</button>
            <div id="status"></div>
        </div>

        <div id="game-section" class="hidden">
            <div id="game-info">Partie en cours contre un adversaire</div>
            <div class="game-grid" id="grid"></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const matchmakingBtn = document.getElementById('matchmaking-btn');
        const statusDiv = document.getElementById('status');
        const menuSection = document.getElementById('menu-section');
        const gameSection = document.getElementById('game-section');
        const gridElement = document.getElementById('grid');

        matchmakingBtn.addEventListener('click', () => {
            matchmakingBtn.disabled = true;
            statusDiv.textContent = "Recherche d'un adversaire en cours...";
            socket.emit('find_match');
        });

        socket.on('waiting', (data) => {
            statusDiv.textContent = data.message;
        });

        socket.on('match_found', (data) => {
            statusDiv.textContent = "Adversaire trouvé ! Lancement...";
            setTimeout(() => {
                menuSection.classList.add('hidden');
                gameSection.classList.remove('hidden');
                initGameGrid();
            }, 1000);
        });

        function initGameGrid() {
            gridElement.innerHTML = '';
            for (let i = 1; i <= 9; i++) {
                const tile = document.createElement('div');
                tile.classList.add('tile');
                tile.textContent = i;
                tile.addEventListener('click', () => {
                    tile.style.backgroundColor = 'var(--accent-pink)';
                    socket.emit('game_action', { roomId: socket.id, action: i });
                });
                gridElement.appendChild(tile);
            }
        }
    </script>
</body>
</html>
