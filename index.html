<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chiffre Blitz 1v1 ⚡</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; touch-action: manipulation; user-select: none; }
        body { font-family: system-ui, sans-serif; background: #0f051d; color: #fff; margin: 0; padding: 15px; text-align: center; transition: background-color 0.2s; }
        h1 { color: #00d2ff; margin-bottom: 5px; }
        
        .hud-1v1 {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
            background: rgba(255,255,255,0.08); padding: 12px; border-radius: 14px; margin-bottom: 15px;
        }
        .player-box { padding: 8px; border-radius: 10px; background: rgba(0,0,0,0.3); }
        .player-box.me { border: 2px solid #00d2ff; }
        .player-box.opponent { border: 2px solid #ff007f; }

        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 400px; margin: 0 auto; }
        .tile {
            background: #2a1845; border: 2px solid #522d80; border-radius: 12px; height: 65px;
            display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900; cursor: pointer;
            transition: transform 0.05s ease;
        }
        .tile:active { transform: scale(0.92); }
        .tile.flash { background: #e52e71; }
        
        button {
            background: linear-gradient(45deg, #ff416c, #ff4b2b); color: white; border: none;
            padding: 16px 28px; font-size: 18px; font-weight: bold; border-radius: 14px; cursor: pointer; width: 100%; max-width: 400px;
        }
        .status { margin: 15px 0; font-weight: bold; color: #ff8a00; }

        #countdown-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 5, 29, 0.95); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100;
        }
        .countdown-num { font-size: 90px; font-weight: 900; color: #00d2ff; animation: pulse 0.8s infinite; }
        
        #recap-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 200; padding: 20px;
        }
        .recap-card {
            background: #1e1035; border: 2px solid #00d2ff; border-radius: 20px;
            padding: 25px; max-width: 380px; width: 100%; box-shadow: 0 0 30px rgba(0,210,255,0.3);
        }
        .recap-title { font-size: 28px; font-weight: 900; margin-bottom: 10px; }
        .recap-row { display: flex; justify-content: space-between; margin: 12px 0; font-size: 18px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }
    </style>
</head>
<body>

    <h1>Duel 1v1 Blitz ⚔️</h1>
    <div id="status" class="status">Connexion au serveur...</div>

    <div id="lobby-ui">
        <button id="find-btn" onclick="startMatchmaking()">TROUVER UN DUEL 1v1</button>
    </div>

    <div id="countdown-overlay" style="display:none;">
        <div style="font-size:24px; color:#aaa; margin-bottom:10px;">PRÉPAREZ-VOUS !</div>
        <div id="countdown-number" class="countdown-num">3</div>
    </div>

    <div id="game-ui" style="display:none;">
        <div class="hud-1v1">
            <div class="player-box me">
                <div>MOI</div>
                <div style="font-size:24px; color:#00d2ff;" id="my-target">1</div>
            </div>
            <div class="player-box opponent">
                <div>ADVERSAIRE</div>
                <div style="font-size:24px; color:#ff007f;" id="opp-target">1</div>
            </div>
        </div>
        
        <div style="font-size:20px; margin-bottom:10px; font-weight:bold;">
            Temps : <span id="timer" style="color:#ff007f;">30</span>s
        </div>

        <div id="grid" class="grid"></div>
    </div>

    <div id="recap-modal" style="display:none;">
        <div class="recap-card">
            <div id="recap-banner" class="recap-title">RÉSULTAT</div>
            <div id="recap-reason" style="color:#aaa; margin-bottom:20px;"></div>
            
            <div class="recap-row">
                <span>🎯 Ma Cible :</span>
                <span id="recap-my-target" style="color:#00d2ff; font-weight:bold;">-</span>
            </div>
            <div class="recap-row">
                <span>🎯 Cible Adversaire :</span>
                <span id="recap-opp-target" style="color:#ff007f; font-weight:bold;">-</span>
            </div>
            <div class="recap-row">
                <span>⭐ Mon Score :</span>
                <span id="recap-my-score" style="font-weight:bold;">-</span>
            </div>

            <button onclick="location.reload()" style="margin-top:20px;">REJOUER</button>
        </div>
    </div>

    <script>
        const SERVER_URL = "https://chiffre-blitz-server.onrender.com";
        const socket = io(SERVER_URL);

        let myId = null;

        socket.on('connect', () => {
            myId = socket.id;
            document.getElementById('status').innerText = "⚡ Connecté au serveur Cloud !";
        });

        function startMatchmaking() {
            document.getElementById('find-btn').style.display = "none";
            socket.emit('find_1v1_match');
        }

        socket.on('matchmaking_status', (msg) => {
            document.getElementById('status').innerText = msg;
        });

        socket.on('start_countdown', () => {
            document.getElementById('status').innerText = "⚔️ Adversaire trouvé !";
            document.getElementById('lobby-ui').style.display = "none";
            document.getElementById('countdown-overlay').style.display = "flex";

            let count = 3;
            document.getElementById('countdown-number').innerText = count;

            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    document.getElementById('countdown-number').innerText = count;
                } else {
                    clearInterval(timer);
                    document.getElementById('countdown-overlay').style.display = "none";
                    document.getElementById('game-ui').style.display = "block";
                }
            }, 1000);
        });

        socket.on('game_started', (data) => {
            document.getElementById('timer').innerText = data.timeLeft;
            renderGrid(data.myPool);
        });

        socket.on('timer_update', (time) => {
            document.getElementById('timer').innerText = time;
        });

        socket.on('grid_shuffled', (data) => {
            const pool = data.pool || data;
            if (data.target) document.getElementById('my-target').innerText = data.target;
            renderGrid(pool, true);
        });

        socket.on('my_grid_updated', (data) => {
            document.getElementById('my-target').innerText = data.target;
            renderGrid(data.newPool);
            
            if (!data.success) {
                document.body.style.backgroundColor = "#35051d";
                setTimeout(() => document.body.style.backgroundColor = "#0f051d", 150);
            }
        });

        socket.on('opponent_progress', (data) => {
            document.getElementById('opp-target').innerText = data.target;
        });

        socket.on('game_over_1v1', (data) => {
            document.getElementById('game-ui').style.display = "none";
            const modal = document.getElementById('recap-modal');
            const banner = document.getElementById('recap-banner');
            
            const myData = data.players[myId];
            const oppId = Object.keys(data.players).find(id => id !== myId);
            const oppData = oppId ? data.players[oppId] : { target: '-', score: 0 };

            if (data.winnerId === myId) {
                banner.innerText = "🏆 VICTOIRE !";
                banner.style.color = "#00d2ff";
            } else if (data.winnerId) {
                banner.innerText = "❌ DÉFAITE !";
                banner.style.color = "#ff007f";
            } else {
                banner.innerText = "⏱️ ÉGALITÉ !";
                banner.style.color = "#ff8a00";
            }

            document.getElementById('recap-reason').innerText = data.reason;
            document.getElementById('recap-my-target').innerText = myData ? myData.target : '-';
            document.getElementById('recap-opp-target').innerText = oppData ? oppData.target : '-';
            document.getElementById('recap-my-score').innerText = myData ? myData.score : 0;

            modal.style.display = "flex";
        });

        socket.on('opponent_left', () => {
            alert("⚠️ Ton adversaire a abandonné la partie !");
            location.reload();
        });

        function renderGrid(pool, isShuffle = false) {
            const grid = document.getElementById('grid');
            if (!grid) return;
            grid.innerHTML = '';
            if (!pool || !Array.isArray(pool)) return;
            
            pool.forEach(num => {
                const tile = document.createElement('div');
                tile.className = 'tile' + (isShuffle ? ' flash' : '');
                tile.innerText = num;
                tile.onclick = () => socket.emit('player_click_1v1', num);
                grid.appendChild(tile);
            });
        }
    </script>
</body>
</html>
